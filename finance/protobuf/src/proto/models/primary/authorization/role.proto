syntax = "proto3";
package role;

message Filter {
    string field = 1;
    string operator = 2;
    string value = 3;
}

message Sorting {
    string field = 1;
    bool ascending = 2;
}

// core message
message Role {
    int32 id = 1;
    string title = 2;
    string description = 3;
}

// POST message
message CreateRoleRequest {
    string title = 1;
    string description = 2;
}

message CreateRoleResponse {
    Role role = 1;
    bool success = 2;
    string message = 3;
}

// READ message
message GetRoleRequest {
    int32 id = 1;
}

message GetRoleResponse {
    Role role = 1;
    bool success = 2;
    string message = 3;
}

message ListRolesRequest {
    int32 page = 1;
    int32 page_size = 2;
    repeated Filter filter = 4;
    int32 offset = 5;
    int32 limit = 6;
    Sorting sort = 7;
}

message ListRolesResponse {
    repeated Role roles = 1;
    int32 total_count = 2;
    bool success = 3;
    string message = 4;
}

// UPDATE message
message UpdateRoleRequest {
    int32 id = 1;
    string title = 2;
    string description = 3;
}

message UpdateRoleResponse {
    Role role = 1;
    bool success = 2;
    string message = 3;
}

// DELETE message
message DeleteRoleRequest {
    int32 id = 1;
}

message DeleteRoleResponse {
    bool success = 1;
    string message = 2;
}