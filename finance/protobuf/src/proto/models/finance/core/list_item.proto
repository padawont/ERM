syntax = "proto3";
package list_item;

message Filter {
    string field = 1;
    string operator = 2;
    string value = 3;
}

message Sorting {
    string field = 1;
    bool ascending = 2;
}

// core message
message ListItem {
    int32 id = 1;
    int32 quantity = 2;
    string description = 3;
    double unit_price = 4;  // Using double for numeric
    double total = 5;       // Using double for numeric
    int32 invoice_id = 6;
}

// POST message
message CreateListItemRequest {
    int32 quantity = 1;
    string description = 2;
    double unit_price = 3;
    double total = 4;
    int32 invoice_id = 5;
}

message CreateListItemResponse {
    ListItem list_item = 1;
    bool success = 2;
    string message = 3;
}

// READ message
message GetListItemRequest {
    int32 id = 1;
}

message GetListItemResponse {
    ListItem list_item = 1;
    bool success = 2;
    string message = 3;
}

message ListListItemsRequest {
    int32 page = 1;
    int32 page_size = 2;
    repeated Filter filter = 4;
    int32 offset = 5;
    int32 limit = 6;
    Sorting sort = 7;
}

message ListListItemsResponse {
    repeated ListItem list_items = 1;
    int32 total_count = 2;
    bool success = 3;
    string message = 4;
}

// UPDATE message
message UpdateListItemRequest {
    int32 id = 1;
    int32 quantity = 2;
    string description = 3;
    double unit_price = 4;
    double total = 5;
    int32 invoice_id = 6;
}

message UpdateListItemResponse {
    ListItem list_item = 1;
    bool success = 2;
    string message = 3;
}

// DELETE message
message DeleteListItemRequest {
    int32 id = 1;
}

message DeleteListItemResponse {
    bool success = 1;
    string message = 2;
}