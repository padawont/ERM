syntax = "proto3";
package income;

message Filter {
    string field = 1;
    string operator = 2;
    string value = 3;
}

message Sorting {
    string field = 1;
    bool ascending = 2;
}

// core message
message Income {
    int32 id = 1;
    int32 company_id = 2;
    int32 currency_id = 3;
    double amount = 4;  // Using double for numeric
}

// POST message
message CreateIncomeRequest {
    int32 company_id = 1;
    int32 currency_id = 2;
    double amount = 3;
}

message CreateIncomeResponse {
    Income income = 1;
    bool success = 2;
    string message = 3;
}

// READ message
message GetIncomeRequest {
    int32 id = 1;
}

message GetIncomeResponse {
    Income income = 1;
    bool success = 2;
    string message = 3;
}

message ListIncomesRequest {
    int32 page = 1;
    int32 page_size = 2;
    repeated Filter filter = 4;
    int32 offset = 5;
    int32 limit = 6;
    Sorting sort = 7;
}

message ListIncomesResponse {
    repeated Income incomes = 1;
    int32 total_count = 2;
    bool success = 3;
    string message = 4;
}

// UPDATE message
message UpdateIncomeRequest {
    int32 id = 1;
    int32 company_id = 2;
    int32 currency_id = 3;
    double amount = 4;
}

message UpdateIncomeResponse {
    Income income = 1;
    bool success = 2;
    string message = 3;
}

// DELETE message
message DeleteIncomeRequest {
    int32 id = 1;
}

message DeleteIncomeResponse {
    bool success = 1;
    string message = 2;
}