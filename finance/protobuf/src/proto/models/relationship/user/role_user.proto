syntax = "proto3";
package role_user;

message Filter {
    string field = 1;
    string operator = 2;
    string value = 3;
}

message Sorting {
    string field = 1;
    bool ascending = 2;
}

// core message
message RoleUser {
    int32 id = 1;
    int32 role_id = 2;
    int32 user_id = 3;
}

// POST message
message CreateRoleUserRequest {
    int32 role_id = 1;
    int32 user_id = 2;
}

message CreateRoleUserResponse {
    RoleUser role_user = 1;
    bool success = 2;
    string message = 3;
}

// READ message
message GetRoleUserRequest {
    int32 id = 1;
}

message GetRoleUserResponse {
    RoleUser role_user = 1;
    bool success = 2;
    string message = 3;
}

message ListRoleUsersRequest {
    int32 page = 1;
    int32 page_size = 2;
    repeated Filter filter = 4;
    int32 offset = 5;
    int32 limit = 6;
    Sorting sort = 7;
}

message ListRoleUsersResponse {
    repeated RoleUser role_users = 1;
    int32 total_count = 2;
    bool success = 3;
    string message = 4;
}

// UPDATE message
message UpdateRoleUserRequest {
    int32 id = 1;
    int32 role_id = 2;
    int32 user_id = 3;
}

message UpdateRoleUserResponse {
    RoleUser role_user = 1;
    bool success = 2;
    string message = 3;
}

// DELETE message
message DeleteRoleUserRequest {
    int32 id = 1;
}

message DeleteRoleUserResponse {
    bool success = 1;
    string message = 2;
}